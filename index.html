<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI新闻播报站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 头部 */
        header {
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(100, 100, 255, 0.1);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-top: 4px;
        }

        /* 日期选择器 */
        .date-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .date-selector label {
            font-size: 14px;
            color: #aaa;
        }

        .date-selector select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(100, 100, 255, 0.2);
            border-radius: 8px;
            padding: 8px 16px;
            color: #e0e0e0;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .date-selector select:hover {
            border-color: rgba(100, 100, 255, 0.4);
        }

        .date-selector select option {
            background: #1a1a2e;
            color: #e0e0e0;
        }

        /* 主内容区 */
        main {
            padding: 40px 0;
        }

        .news-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(100, 100, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .news-card:hover {
            border-color: rgba(100, 100, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .news-date {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #888;
        }

        .news-date .icon {
            font-size: 16px;
        }

        .news-type {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .news-title {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 12px;
            color: #fff;
        }

        .news-summary {
            font-size: 16px;
            line-height: 1.8;
            color: #bbb;
            margin-bottom: 20px;
        }

        .news-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #888;
        }

        .news-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .news-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 10px 20px;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 8px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .news-link:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 100px 20px;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: #fff;
        }

        .empty-state p {
            color: #888;
            font-size: 16px;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 40px 0;
            border-top: 1px solid rgba(100, 100, 255, 0.1);
            color: #666;
            font-size: 14px;
        }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 100px 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .news-title {
                font-size: 18px;
            }

            .news-summary {
                font-size: 14px;
            }

            .news-card {
                padding: 20px;
            }
        }

        /* 评分标签 */
        .score-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .score-high {
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
        }

        .score-medium {
            background: rgba(255, 165, 2, 0.15);
            color: #ffa502;
        }

        .score-low {
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">🤖</div>
                    <div>
                        <div class="logo-text">AI新闻播报站</div>
                        <div class="subtitle">每日AI行业精选资讯</div>
                    </div>
                </div>
                <div class="date-selector">
                    <label for="dateSelect">📅 选择日期：</label>
                    <select id="dateSelect">
                        <option value="">加载中...</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div id="newsContainer">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在加载播报内容...</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>🤖 由小小怪下士自动生成 · 每日更新</p>
        </div>
    </footer>

    <script>
        // 数据存储（实际使用时会被替换为真实数据）
        let newsData = [];

        // 初始化
        async function init() {
            try {
                // 尝试加载数据文件
                const response = await fetch('news-data.json');
                if (response.ok) {
                    newsData = await response.json();
                }
            } catch (e) {
                console.log('使用默认数据');
            }

            populateDateSelector();
            loadNews();
        }

        // 填充日期选择器
        function populateDateSelector() {
            const select = document.getElementById('dateSelect');
            const dates = [...new Set(newsData.map(item => item.date))].sort().reverse();

            if (dates.length === 0) {
                select.innerHTML = '<option value="">暂无数据</option>';
                return;
            }

            select.innerHTML = '<option value="">全部日期</option>' +
                dates.map(date => `<option value="${date}">${date}</option>`).join('');

            select.addEventListener('change', loadNews);
        }

        // 加载新闻内容
        function loadNews() {
            const container = document.getElementById('newsContainer');
            const selectedDate = document.getElementById('dateSelect').value;

            let filtered = newsData;
            if (selectedDate) {
                filtered = newsData.filter(item => item.date === selectedDate);
            }

            // 按日期倒序
            filtered.sort((a, b) => new Date(b.date + ' ' + b.time) - new Date(a.date + ' ' + a.time));

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h2>暂无播报内容</h2>
                        <p>该日期暂无AI新闻播报，请选择其他日期</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <article class="news-card">
                    <div class="news-header">
                        <div class="news-date">
                            <span class="icon">📅</span>
                            <span>${item.date} ${item.time}</span>
                        </div>
                        <span class="news-type">${item.type || 'AI早报'}</span>
                    </div>
                    <h2 class="news-title">${item.title}</h2>
                    <p class="news-summary">${item.summary}</p>
                    <div class="news-meta">
                        <span>📊 质量评分: <span class="score-badge ${getScoreClass(item.score)}">${item.score}分</span></span>
                        <span>🏷️ ${item.source || 'AI精选'}</span>
                        ${item.keywords ? `<span>🔑 ${item.keywords}</span>` : ''}
                    </div>
                    ${item.url ? `<a href="${item.url}" target="_blank" class="news-link">阅读原文 →</a>` : ''}
                </article>
            `).join('');
        }

        // 获取评分样式
        function getScoreClass(score) {
            if (score >= 5) return 'score-high';
            if (score >= 3) return 'score-medium';
            return 'score-low';
        }

        // 启动
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
